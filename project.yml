name: Glint

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      SWIFT_OPTIMIZATION_LEVEL: -Osize

packages:
  GlintCore:
    path: Packages/GlintCore
  GlintRimeRelayCore:
    path: Packages/GlintRimeRelayCore
  GlintMac:
    path: Packages/GlintMac
  GlintDictionary:
    path: Packages/GlintDictionary
  GlintInference:
    path: Packages/GlintInference
  GlintPlugins:
    path: Packages/GlintPlugins
  GlintUI:
    path: Packages/GlintUI

targets:
  Glint:
    type: application
    platform: macOS
    sources:
      - path: App/Glint
        excludes:
          - Info.plist
          - Glint.entitlements
      - path: Resources/catalog.json
        buildPhase: resources
      - path: Resources/Plugins/dict-cedict
        buildPhase: resources
        type: folder
      - path: Resources/Plugins/dict-ecdict
        buildPhase: resources
        type: folder
      - path: Resources/CTranslate2Runtime
        buildPhase: resources
        type: folder
      - path: Tools/RimeCandidateLab/rime/lua/glint/candidate_bridge.lua
        buildPhase:
          copyFiles:
            destination: resources
            subpath: RimeCandidateBridge
      - path: Tools/RimeCandidateLab/rime/lua/glint/json.lua
        buildPhase:
          copyFiles:
            destination: resources
            subpath: RimeCandidateBridge
    info:
      path: App/Glint/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: App/Glint/Glint.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.glint
        PRODUCT_NAME: Glint
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "18"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Glint/Glint.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
    dependencies:
      - package: GlintCore
        product: GlintCore
      - package: GlintMac
        product: GlintMac
      - package: GlintDictionary
        product: GlintDictionary
      - package: GlintInference
        product: GlintInference
      - package: GlintPlugins
        product: GlintPlugins
      - package: GlintUI
        product: GlintUI
      - target: RimeCandidateBridge
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  RimeCandidateBridge:
    type: tool
    platform: macOS
    sources:
      - path: Tools/RimeCandidateLab/Sources/RimeCandidateBridge
    dependencies:
      - package: GlintRimeRelayCore
        product: GlintRimeRelayCore
    settings:
      base:
        PRODUCT_NAME: RimeCandidateBridge

  GlintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/GlintTests
    dependencies:
      - package: GlintCore
        product: GlintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.glint.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Glint:
    build:
      targets:
        Glint: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlintTests
