name: Glint

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  GlintCore:
    path: Packages/GlintCore
  GlintMac:
    path: Packages/GlintMac
  GlintDictionary:
    path: Packages/GlintDictionary
  GlintInference:
    path: Packages/GlintInference
  GlintPlugins:
    path: Packages/GlintPlugins
  GlintUI:
    path: Packages/GlintUI

targets:
  Glint:
    type: application
    platform: macOS
    sources:
      - path: App/Glint
        excludes:
          - Info.plist
          - Glint.entitlements
      - path: Resources
        buildPhase: resources
        type: folder
    info:
      path: App/Glint/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: App/Glint/Glint.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.glint
        PRODUCT_NAME: Glint
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Glint/Glint.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
    dependencies:
      - package: GlintCore
        product: GlintCore
      - package: GlintMac
        product: GlintMac
      - package: GlintDictionary
        product: GlintDictionary
      - package: GlintInference
        product: GlintInference
      - package: GlintPlugins
        product: GlintPlugins
      - package: GlintUI
        product: GlintUI

  GlintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/GlintTests
    dependencies:
      - package: GlintCore
        product: GlintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.glint.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Glint:
    build:
      targets:
        Glint: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlintTests
