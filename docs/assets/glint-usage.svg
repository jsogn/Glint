<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="0.55" stop-color="#0D0F14"/>
      <stop offset="1" stop-color="#17131A"/>
    </linearGradient>
    <linearGradient id="windowSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1E23"/>
      <stop offset="0.5" stop-color="#1A1B20"/>
      <stop offset="1" stop-color="#17181D"/>
    </linearGradient>
    <linearGradient id="windowBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3AAB6" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#666C77" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#454A54" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4878FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4878FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE600" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="floatingShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      }
      .editor { fill: #F5F6F8; font-size: 27px; font-weight: 500; }
      .candidate { fill: #F2F2F3; font-size: 18px; font-weight: 500; }
      .candidate-index { fill: #A8A9AD; font-size: 12px; font-weight: 600; }
      .candidate-selected { fill: #FFFFFF; font-size: 19px; font-weight: 650; }
      .candidate-index-selected { fill: #FFFFFF; font-size: 12px; font-weight: 650; }
      .result { fill: #F4F5F7; font-size: 18px; font-weight: 450; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#desktop)"/>
  <ellipse cx="260" cy="150" rx="560" ry="340" fill="url(#glowBlue)"/>
  <ellipse cx="1360" cy="850" rx="500" ry="300" fill="url(#glowWarm)"/>

  <g filter="url(#windowShadow)">
    <rect x="180" y="90" width="1240" height="720" rx="26" fill="#17181D"/>
  </g>
  <rect x="180" y="90" width="1240" height="720" rx="26" fill="url(#windowSurface)" stroke="url(#windowBorder)" stroke-width="1.2"/>

  <path d="M207 91h1186" stroke="#D9DFEA" stroke-opacity="0.14" stroke-linecap="round"/>

  <circle cx="218" cy="118" r="7" fill="#FF5F57"/>
  <circle cx="242" cy="118" r="7" fill="#FEBC2E"/>
  <circle cx="266" cy="118" r="7" fill="#28C840"/>

  <text x="250" y="260" class="editor">每天进步一点，持续</text>
  <text x="502" y="260" class="editor">xue</text>
  <line x1="500" y1="272" x2="552" y2="272" stroke="#4C8FFF" stroke-width="2"/>
  <rect x="558" y="235" width="2.5" height="38" rx="1.25" fill="#4F94FF"/>

  <g filter="url(#floatingShadow)">
    <rect x="230" y="306" width="670" height="56" rx="28" fill="#292A2E" fill-opacity="0.97" stroke="#555861" stroke-width="1.2"/>
  </g>
  <rect x="241" y="316" width="124" height="36" rx="18" fill="#0A84FF" stroke="#4AA4FF" stroke-opacity="0.55"/>
  <text x="255" y="341" class="candidate-index-selected">1</text>
  <text x="273" y="341" class="candidate-selected">学习</text>

  <text x="390" y="341" class="candidate-index">2</text>
  <image x="414" y="320" width="28" height="28" href="data:image/png;base64,"/>

  <text x="472" y="341" class="candidate-index">3</text>
  <text x="490" y="341" class="candidate">学校</text>
  <text x="560" y="341" class="candidate-index">4</text>
  <text x="578" y="341" class="candidate">学生</text>
  <text x="648" y="341" class="candidate-index">5</text>
  <text x="666" y="341" class="candidate">学会</text>
  <text x="736" y="341" class="candidate-index">6</text>
  <text x="754" y="341" class="candidate">学</text>

  <line x1="816" y1="319" x2="816" y2="349" stroke="#FFFFFF" stroke-opacity="0.17"/>
  <path d="M839 330l7 7 7-7" fill="none" stroke="#D3D4D7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#floatingShadow)">
    <rect x="230" y="376" width="250" height="46" rx="23" fill="#1A1B1F" fill-opacity="0.97" stroke="#FFFFFF" stroke-opacity="0.27" stroke-width="1.2"/>
  </g>
  <text x="250" y="406" class="result">learn · study</text>
</svg>
