<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="0.55" stop-color="#0D0F14"/>
      <stop offset="1" stop-color="#17131A"/>
    </linearGradient>
    <linearGradient id="windowSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1E23"/>
      <stop offset="0.5" stop-color="#1A1B20"/>
      <stop offset="1" stop-color="#17181D"/>
    </linearGradient>
    <linearGradient id="windowTitlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23242A"/>
      <stop offset="1" stop-color="#1E1F25"/>
    </linearGradient>
    <linearGradient id="windowBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818793" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#4E525C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#30333A" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="titlebarSeparator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4878FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4878FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE600" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="36" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="floatingShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="selectedShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0A79F0" flood-opacity="0.16"/>
    </filter>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      }
      .editor { fill: #F5F6F8; font-size: 31px; font-weight: 500; }
      .candidate { fill: #F2F2F3; font-size: 20px; font-weight: 500; }
      .candidate-index { fill: #A8A9AD; font-size: 14px; font-weight: 600; }
      .candidate-selected { fill: #FFFFFF; font-size: 21px; font-weight: 650; }
      .candidate-index-selected { fill: #FFFFFF; font-size: 14px; font-weight: 650; }
      .result { fill: #F4F5F7; font-size: 20px; font-weight: 450; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#desktop)"/>
  <ellipse cx="260" cy="150" rx="560" ry="340" fill="url(#glowBlue)"/>
  <ellipse cx="1360" cy="850" rx="500" ry="300" fill="url(#glowWarm)"/>

  <g filter="url(#windowShadow)">
    <rect x="180" y="90" width="1240" height="720" rx="26" fill="#17181D"/>
  </g>
  <rect x="180" y="90" width="1240" height="720" rx="26" fill="url(#windowSurface)" stroke="url(#windowBorder)" stroke-width="1"/>

  <path d="M180 116a26 26 0 0 1 26-26h1188a26 26 0 0 1 26 26v38H180z" fill="url(#windowTitlebar)"/>
  <path d="M207 91h1186" stroke="#D9DFEA" stroke-opacity="0.09" stroke-linecap="round"/>
  <line x1="180" y1="154" x2="1420" y2="154" stroke="url(#titlebarSeparator)" stroke-width="1"/>

  <circle cx="218" cy="118" r="7" fill="#FF5F57"/>
  <circle cx="242" cy="118" r="7" fill="#FEBC2E"/>
  <circle cx="266" cy="118" r="7" fill="#28C840"/>

  <text x="250" y="260" class="editor">每天进步一点，持续</text>
  <text x="540" y="260" class="editor">xue</text>
  <line x1="538" y1="272" x2="591" y2="272" stroke="#4C8FFF" stroke-width="2"/>
  <rect x="598" y="232" width="2.5" height="41" rx="1.25" fill="#4F94FF"/>

  <g filter="url(#floatingShadow)">
    <rect x="230" y="302" width="1060" height="62" rx="31" fill="#292A2E" fill-opacity="0.97" stroke="#46484E" stroke-width="1.2"/>
  </g>
  <g filter="url(#selectedShadow)">
    <rect x="241" y="312" width="154" height="42" rx="21" fill="#0A84FF"/>
  </g>
  <text x="257" y="341" class="candidate-index-selected">1</text>
  <text x="276" y="341" class="candidate-selected">学习</text>

  <text x="430" y="341" class="candidate-index">2</text>
  <image x="456" y="318" width="30" height="30" href="data:image/png;base64,"/>

  <text x="528" y="341" class="candidate-index">3</text>
  <text x="548" y="341" class="candidate">学校</text>
  <text x="683" y="341" class="candidate-index">4</text>
  <text x="703" y="341" class="candidate">学生</text>
  <text x="838" y="341" class="candidate-index">5</text>
  <text x="858" y="341" class="candidate">学会</text>
  <text x="972" y="341" class="candidate-index">6</text>
  <text x="992" y="341" class="candidate">学</text>

  <line x1="1186" y1="315" x2="1186" y2="351" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M1211 326l8 8 8-8" fill="none" stroke="#D3D4D7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#floatingShadow)">
    <rect x="230" y="376" width="310" height="52" rx="26" fill="#1A1B1F" fill-opacity="0.97" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2"/>
  </g>
  <text x="252" y="411" class="result">learn · study</text>
</svg>
