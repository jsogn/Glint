<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="0.55" stop-color="#0D0F14"/>
      <stop offset="1" stop-color="#17131A"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4878FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4878FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE600" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      }
      .window-title { fill: #A9ADB7; font-size: 16px; font-weight: 500; }
      .editor { fill: #F5F6F8; font-size: 31px; font-weight: 500; }
      .candidate { fill: #E9EBF0; font-size: 17px; font-weight: 520; }
      .candidate-index { fill: #FFFFFF; font-size: 12px; font-weight: 600; opacity: 0.72; }
      .candidate-selected { fill: #FFFFFF; font-size: 17px; font-weight: 650; }
      .result { fill: #F4F5F7; font-size: 17px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#desktop)"/>
  <ellipse cx="260" cy="150" rx="560" ry="340" fill="url(#glowBlue)"/>
  <ellipse cx="1360" cy="850" rx="500" ry="300" fill="url(#glowWarm)"/>

  <g filter="url(#windowShadow)">
    <rect x="180" y="90" width="1240" height="720" rx="26" fill="#1A1B20" stroke="#3A3C45" stroke-width="1.4"/>
  </g>

  <path d="M180 116a26 26 0 0 1 26-26h1188a26 26 0 0 1 26 26v38H180z" fill="#202127"/>
  <line x1="180" y1="154" x2="1420" y2="154" stroke="#33353D" stroke-width="1"/>

  <circle cx="218" cy="118" r="7" fill="#FF5F57"/>
  <circle cx="242" cy="118" r="7" fill="#FEBC2E"/>
  <circle cx="266" cy="118" r="7" fill="#28C840"/>
  <text x="306" y="124" class="window-title">英语笔记</text>

  <text x="250" y="260" class="editor">每天进步一点，持续学习</text>
  <rect x="596" y="232" width="2.5" height="34" rx="1.25" fill="#5D9BFF"/>

  <g filter="url(#softShadow)">
    <rect x="560" y="326" width="460" height="50" rx="25" fill="#292A30" fill-opacity="0.96" stroke="#4C4E58" stroke-width="1.1"/>
  </g>
  <rect x="570" y="334" width="110" height="34" rx="17" fill="#0A84FF"/>
  <text x="584" y="357" class="candidate-index">1</text>
  <text x="600" y="357" class="candidate-selected">学习</text>
  <text x="700" y="357" class="candidate">学校</text>
  <text x="770" y="357" class="candidate">学生</text>
  <text x="840" y="357" class="candidate">学会</text>

  <g filter="url(#softShadow)">
    <rect x="570" y="390" width="240" height="36" rx="18" fill="#303137" fill-opacity="0.94" stroke="#50525D" stroke-width="1"/>
  </g>
  <text x="588" y="414" class="result">learn · study</text>
</svg>
