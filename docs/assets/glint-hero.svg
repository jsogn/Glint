<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1D23"/>
      <stop offset="0.55" stop-color="#14161B"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="iconTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0F3"/>
