      <stop offset="0.55" stop-color="#2E6DE5" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2E6DE5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D9E4FF" stroke-opacity="0.035"/>
