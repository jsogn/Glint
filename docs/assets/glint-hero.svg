<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFAF5"/>
      <stop offset="0.58" stop-color="#F9F6EF"/>
      <stop offset="1" stop-color="#F2EEE6"/>
    </linearGradient>
    <linearGradient id="iconTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F2F4"/>
    </linearGradient>
    <radialGradient id="paperLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueWash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2F7DFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2F7DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="paperGrain" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M-2 18L18 -2" fill="none" stroke="#746B5D" stroke-opacity="0.018"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="44" y="28" width="1512" height="384" rx="30"/>
    </clipPath>
    <style>
      text {
        font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      }
      .wordmark { fill: #1D1F23; font-size: 56px; font-weight: 700; letter-spacing: -1px; }
      .tagline { fill: #555B64; font-size: 22px; font-weight: 450; }
      .details { fill: #858983; font-size: 16px; font-weight: 500; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect x="44" y="28" width="1512" height="384" rx="30" fill="url(#paper)" stroke="#D8D2C7"/>
  <g clip-path="url(#panelClip)">
    <rect x="44" y="28" width="1512" height="384" fill="url(#paperGrain)"/>
    <ellipse cx="320" cy="72" rx="620" ry="290" fill="url(#paperLight)"/>
    <ellipse cx="1310" cy="220" rx="360" ry="235" fill="url(#blueWash)"/>

    <g stroke="#D8D2C7" stroke-opacity="0.42">
      <path d="M1000 105h492"/>
      <path d="M1000 160h492"/>
      <path d="M1000 215h492"/>
      <path d="M1000 270h492"/>
      <path d="M1000 325h492"/>
    </g>

    <rect x="1120" y="110" width="4" height="96" rx="2" fill="#2F7DFF" opacity="0.24"/>
    <g fill="#2F7DFF">
      <circle cx="1186" cy="317" r="9" opacity="0.16"/>
      <circle cx="1242" cy="274" r="12" opacity="0.19"/>
      <circle cx="1306" cy="222" r="16" opacity="0.22"/>
      <path d="M1396 140L1413 202L1475 219L1413 236L1396 298L1379 236L1317 219L1379 202Z" opacity="0.25"/>
    </g>
  </g>

  <rect x="128" y="160" width="120" height="120" rx="28" fill="url(#iconTile)" stroke="#D6D8DC"/>
  <g fill="#111318" transform="translate(139.25 175) scale(3.75)">
    <rect x="2.4" y="3" width="7.2" height="2.6" rx="1.3"/>
    <rect x="2.4" y="18.4" width="7.2" height="2.6" rx="1.3"/>
    <rect x="4.7" y="4.2" width="2.6" height="15.6" rx="1.3"/>
    <circle cx="12.3" cy="15" r="1.25"/>
