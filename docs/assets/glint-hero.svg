  <text x="292" y="196" class="wordmark">Glint</text>
  <text x="294" y="242" class="tagline">输入中文拼音时，在候选栏旁查看对应的英文翻译。</text>
  <rect x="296" y="262" width="150" height="3" rx="1.5" fill="#2F7DFF"/>
