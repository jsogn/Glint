      .tagline { fill: #B5BAC4; font-size: 24px; font-weight: 450; }
      .details { fill: #717985; font-size: 17px; font-weight: 500; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect x="44" y="36" width="1512" height="448" rx="32" fill="url(#panel)" stroke="#4D5260" stroke-opacity="0.62"/>
  <g clip-path="url(#panelClip)">
