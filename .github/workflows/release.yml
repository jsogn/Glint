name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-release:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache OPUS conversion inputs
        uses: actions/cache@v6
        with:
          path: |
            Tools/ModelLab/.cache
          key: opus-py313-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/ModelLab/prepare_opus_model.py', 'Tools/ModelLab/requirements-opus-conversion.txt', 'Resources/Plugins/mt-opus-zh-en/model-lock.json') }}

      - name: Lint Swift
        run: git ls-files '*.swift' -z | xargs -0 swift format lint --strict --configuration .swift-format

      - name: Run release gate
        run: ./scripts/test.sh

      - name: Run Python tool tests
        run: zsh ./scripts/test_python_tools.sh

      - name: Build ad-hoc developer packages
        run: ./scripts/package_test_distributions.sh

      - name: Validate tag and package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          dmg_path="$(find build-release -maxdepth 1 -name 'Glint-*-macOS26-arm64.dmg' -print -quit)"
          pkg_path="$(find build-release -maxdepth 1 -name 'Glint-*-Installer-macOS26-arm64.pkg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "DMG was not produced." >&2
            exit 1
          fi
          if [[ -z "$pkg_path" ]]; then
            echo "PKG was not produced." >&2
            exit 1
          fi
          dmg_version="$(basename "$dmg_path" | sed -E 's/^Glint-(.*)-macOS26-arm64\.dmg$/\1/')"
          pkg_version="$(basename "$pkg_path" | sed -E 's/^Glint-(.*)-Installer-macOS26-arm64\.pkg$/\1/')"
          if [[ "$dmg_version" != "$tag_version" || "$pkg_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match package versions: DMG=$dmg_version PKG=$pkg_version." >&2
            exit 1
          fi
          if [[ ! -f "$dmg_path.sha256" || ! -f "$pkg_path.sha256" ]]; then
            echo "Package checksum files were not produced." >&2
            exit 1
          fi

      - name: Publish GitHub latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg_path="$(find build-release -maxdepth 1 -name 'Glint-*-macOS26-arm64.dmg' -print -quit)"
          pkg_path="$(find build-release -maxdepth 1 -name 'Glint-*-Installer-macOS26-arm64.pkg' -print -quit)"
          gh release create "$GITHUB_REF_NAME" \
            "$dmg_path" \
            "$dmg_path.sha256" \
            "$pkg_path" \
            "$pkg_path.sha256" \
            --verify-tag \
            --latest \
            --title "Glint ${GITHUB_REF_NAME#v}" \
            --notes-file Resources/Distribution/GITHUB-RELEASE-NOTES.md
